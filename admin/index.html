<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>FAQ · Admin</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20251f;background:#f6f7f2;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:34px 24px 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.top h1{font-size:26px;margin:0}.top a{color:#36754e;text-decoration:none;font-weight:700}.card{background:#fff;border:1px solid #e3e6dd;border-radius:14px;padding:22px;margin-bottom:18px}.login{max-width:430px;margin:10vh auto}.muted{color:#73796f;font-size:13px;line-height:1.5}.field{display:grid;gap:7px;margin:18px 0}.field input{font:inherit;border:1px solid #dfe3da;border-radius:8px;padding:12px}.btn{background:#36754e;border:0;border-radius:8px;color:#fff;padding:10px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.btn.secondary{background:#eff4ed;color:#36754e}.btn.danger{background:#fff0ed;color:#a63424}.error{color:#a63424;font-size:13px;min-height:20px;margin-top:10px}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.section-head h2{font-size:18px;margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px;font-size:12px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid #edf0e9;vertical-align:top}th{color:#72796e;font-size:10px;text-transform:uppercase;letter-spacing:.06em}td.actions{white-space:nowrap}.actions button{margin-right:6px}.empty{color:#858b80;padding:18px;text-align:center}.status{font-size:12px;color:#4e6d52}#console[hidden],#login[hidden]{display:none}
  </style>
</head>
<body>
  <main class="wrap">
    <section id="login" class="card login" hidden>
      <div class="top"><h1>FAQ Admin</h1><a href="/">← Main app</a></div>
      <p class="muted">Sign in to manage polls, votes, meals, guest profiles, and feedback.</p>
      <form id="loginForm"><label class="field">Admin password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">Sign in</button><div class="error" id="loginError" role="alert"></div></form>
    </section>
    <section id="console" hidden>
      <div class="top"><div><a href="/">FAQ - Food Acquisition</a><h1 style="margin-top:8px">Admin console</h1></div><button class="btn secondary" id="logout">Sign out</button></div>
      <p class="muted">Changes here apply directly to the shared database. Deleting a person also removes their feedback, votes, and polls they created. Deleting a meal removes its feedback.</p>
      <div class="status" id="status" aria-live="polite"></div>
      <div id="sections"></div>
    </section>
  </main>
  <script>
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let data={};
    async function api(path,options={}){const response=await fetch(path,{...options,credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})}});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||'Request failed');return body}
    function notice(message){$('#status').textContent=message;setTimeout(()=>$('#status').textContent='',3500)}
    function section(title,type,rows,columns){return `<section class="card"><div class="section-head"><h2>${title}</h2><span class="muted">${rows.length} records</span></div>${rows.length?`<div class="table-wrap"><table><thead><tr>${columns.map(c=>`<th>${c.label}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${rows.map(row=>`<tr>${columns.map(c=>`<td>${esc(c.value(row))}</td>`).join('')}<td class="actions"><button class="btn secondary" data-edit="${type}" data-id="${esc(row.id)}">Edit</button><button class="btn danger" data-delete="${type}" data-id="${esc(row.id)}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No records.</div>'}</section>`}
    function render(){const pollById=new Map((data.polls||[]).map(x=>[x.id,x]));$('#sections').innerHTML=
      section('People','people',data.people||[],[{label:'Name',value:r=>r.name},{label:'Created',value:r=>new Date(r.createdAt).toLocaleString()}])+ 
      section('Meals','meals',data.meals||[],[{label:'Meal',value:r=>r.name},{label:'Meal ID',value:r=>r.id},{label:'Source poll',value:r=>pollById.get(r.sourcePollId)?.title||'Standalone'},{label:'Created',value:r=>new Date(r.createdAt).toLocaleString()}])+ 
      section('Meal feedback','feedback',data.feedback||[],[{label:'Person',value:r=>r.name},{label:'Meal / event',value:r=>r.mealName||r.mealId},{label:'Meal type',value:r=>r.meal},{label:'Big Back Score',value:r=>r.calories},{label:'Rating',value:r=>r.rating},{label:'Recommend',value:r=>r.recommend},{label:'Cost',value:r=>`$${Number(r.cost).toFixed(2)}`}])+ 
      section('Polls','polls',data.polls||[],[{label:'Poll',value:r=>r.title},{label:'Options',value:r=>r.options.join(', ')},{label:'Status',value:r=>r.active?'Open':'Closed'},{label:'Created by',value:r=>r.createdBy||'Unknown'}])+ 
      section('Votes','votes',data.votes||[],[{label:'Person',value:r=>r.name||'Name not recorded'},{label:'Poll',value:r=>r.pollTitle},{label:'Choice',value:r=>r.option},{label:'Voted',value:r=>new Date(r.createdAt).toLocaleString()}]);
      document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit,b.dataset.id));
      document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete,b.dataset.id));
    }
    async function load(){data=await api('/api/admin/data');render()}
    function pick(label,value){const result=prompt(label,value??'');return result===null?null:result}
    async function edit(type,id){const rows=data[type]||[],row=rows.find(r=>String(r.id)===String(id));if(!row)return;let payload={type,id};
      if(type==='people'){const name=pick('Guest name',row.name);if(name===null)return;payload.name=name}
      if(type==='meals'){const name=pick('Meal name',row.name);if(name===null)return;payload.name=name}
      if(type==='feedback'){const fields=[['name','Person name',row.name],['mealId','Meal ID',row.mealId],['meal','Meal type',row.meal],['calories','Big Back Score (1–10)',row.calories],['rating','Food rating (1–10)',row.rating],['recommend','Recommend? (Yes/No)',row.recommend],['cost','Cost per person',row.cost]];for(const [key,label,value] of fields){const v=pick(label,value);if(v===null)return;payload[key]=key==='calories'||key==='rating'||key==='cost'?Number(v):v}}
      if(type==='votes'){const option=pick('Choice',row.option);if(option===null)return;const name=pick('Voter name',row.name);if(name===null)return;payload.option=option;payload.name=name}
      if(type==='polls'){const title=pick('Poll question',row.title);if(title===null)return;const description=pick('Description',row.description);if(description===null)return;const options=pick('Options (comma separated)',row.options.join(', '));if(options===null)return;const participants=pick('Expected voters (comma separated)',(row.participants||[]).join(', '));if(participants===null)return;const active=confirm('Poll is currently '+(row.active?'open':'closed')+'. OK = open, Cancel = closed.');payload.title=title;payload.description=description;payload.options=options.split(',').map(x=>x.trim()).filter(Boolean);payload.participants=participants.split(',').map(x=>x.trim()).filter(Boolean);payload.active=active}
      try{await api('/api/admin/record',{method:'PATCH',body:JSON.stringify(payload)});await load();notice('Record updated.')}catch(error){alert(error.message)}}
    async function remove(type,id){const row=(data[type]||[]).find(r=>String(r.id)===String(id));if(!row)return;const label=type==='people'?row.name:type==='meals'?row.name:type==='feedback'?`${row.name}'s feedback for ${row.mealName||row.mealId}`:type==='polls'?row.title:`${row.name}'s vote on ${row.pollTitle}`;if(!confirm(`Delete ${label}? This cannot be undone.`))return;try{await api('/api/admin/record',{method:'DELETE',body:JSON.stringify({type,id})});await load();notice('Record deleted.')}catch(error){alert(error.message)}}
    $('#loginForm').onsubmit=async event=>{event.preventDefault();$('#loginError').textContent='';try{await api('/api/admin/auth',{method:'POST',body:JSON.stringify({password:$('#password').value})});$('#password').value='';$('#login').hidden=true;$('#console').hidden=false;await load()}catch(error){$('#loginError').textContent=error.message}};
    $('#logout').onclick=async()=>{await api('/api/admin/auth',{method:'DELETE'});$('#console').hidden=true;$('#login').hidden=false};
    (async()=>{try{const state=await api('/api/admin/auth');if(!state.configured){$('#login').hidden=false;$('#loginError').textContent='Admin is not configured yet. Set ADMIN_PASSWORD and ADMIN_SESSION_SECRET in Vercel, then redeploy.';return}if(state.authenticated){$('#console').hidden=false;await load()}else $('#login').hidden=false}catch(error){$('#login').hidden=false;$('#loginError').textContent=error.message}})();
  </script>
</body>
</html>
